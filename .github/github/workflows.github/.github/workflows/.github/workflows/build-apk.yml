name: Build Athkar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project if Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name athkar_muslim --org com.muslim.athkar --platforms=android /tmp/fproj
            cp -r /tmp/fproj/android .
            cp /tmp/fproj/.metadata . 2>/dev/null || true
          fi

      - name: Configure Pubspec, Manifest & Gradle
        run: |
          cat << 'PYEOF' > /tmp/patch.py
          import os, re, shutil

          if not os.path.exists("lib/main.dart") and os.path.exists("main.dart"):
              os.makedirs("lib", exist_ok=True)
              shutil.move("main.dart", "lib/main.dart")

          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  pub = f.read()
              if "uses-material-design" not in pub:
                  if re.search(r'^flutter:\s*$', pub, re.M):
                      pub = re.sub(r'^flutter:\s*$', 'flutter:\n  uses-material-design: true', pub, count=1, flags=re.M)
                  else:
                      pub += "\nflutter:\n  uses-material-design: true\n"
                  with open("pubspec.yaml", "w", encoding="utf-8") as f:
                      f.write(pub)

          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r", encoding="utf-8") as f:
              m = f.read()
          m = re.sub(r'android:label="[^"]*"', 'android:label="أذكار المسلم"', m)
          perms = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
          ]
          for p in perms:
              if p not in m:
                  m = m.replace("<application", f"    {p}\n    <application", 1)
          with open(manifest, "w", encoding="utf-8") as f:
              f.write(m)

          root_kts = "android/build.gradle.kts"
          root_groovy = "android/build.gradle"
          if os.path.exists(root_kts):
              with open(root_kts, "r", encoding="utf-8") as f:
                  rk = f.read()
              if "LibraryExtension" not in rk and "subprojects {" in rk:
                  ns_fix = (
                      "subprojects {\n"
                      "    afterEvaluate {\n"
                      "        extensions.findByType<com.android.build.gradle.LibraryExtension>()?.apply {\n"
                      "            if (namespace == null) {\n"
                      "                namespace = group.toString()\n"
                      "            }\n"
                      "        }\n"
                      "    }\n"
                  )
                  rk = rk.replace("subprojects {", ns_fix, 1)
                  with open(root_kts, "w", encoding="utf-8") as f:
                      f.write(rk)
          elif os.path.exists(root_groovy):
              with open(root_groovy, "r", encoding="utf-8") as f:
                  rg = f.read()
              if "project.android.namespace" not in rg and "subprojects {" in rg:
                  ns_fix = (
                      "subprojects {\n"
                      "    afterEvaluate { project ->\n"
                      "        if (project.hasProperty('android') && project.android.namespace == null) {\n"
                      "            project.android.namespace = project.group.toString()\n"
                      "        }\n"
                      "    }\n"
                  )
                  rg = rg.replace("subprojects {", ns_fix, 1)
                  with open(root_groovy, "w", encoding="utf-8") as f:
                      f.write(rg)

          kts = "android/app/build.gradle.kts"
          groovy = "android/app/build.gradle"
          if os.path.exists(kts):
              with open(kts, "r", encoding="utf-8") as f:
                  g = f.read()
              if "isCoreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "multiDexEnabled" not in g:
                  g = g.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true", 1)
              g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', g)
              if "desugar_jdk_libs" not in g:
                  if "dependencies {" in g:
                      g = g.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
                  else:
                      g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              with open(kts, "w", encoding="utf-8") as f:
                  f.write(g)
          elif os.path.exists(groovy):
              with open(groovy, "r", encoding="utf-8") as f:
                  g = f.read()
              if "coreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              if "multiDexEnabled" not in g:
                  g = g.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true", 1)
              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', g)
              if "desugar_jdk_libs" not in g:
                  g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              with open(groovy, "w", encoding="utf-8") as f:
                  f.write(g)
          PYEOF
          python3 /tmp/patch.py

      - name: Get Packages & Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athkar-Muslim-APK
          path: build/app/outputs/apk/release/app-release.apk
